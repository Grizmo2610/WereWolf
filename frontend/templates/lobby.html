<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Sói Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/custom.css">
<style>
  body {
    background:
      radial-gradient(ellipse at 20% 80%, rgba(17,81,111,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(251,211,132,0.06) 0%, transparent 50%),
      #06101a;
  }
  .title-glow { text-shadow: 0 0 40px rgba(251,211,132,0.15), 0 0 80px rgba(17,81,111,0.2); }
  .phase-badge { display:none; }
</style>
</head>
<body class="min-h-screen text-[#f3d8bb] selection:bg-[#267e96] selection:text-[#06101a]">

<div class="min-h-screen flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="mb-10 text-center">
      <p class="tracking-[0.5em] text-[10px] text-[#fbd384] uppercase mb-3 font-semibold">
        ✦ Đêm trăng tròn ✦
      </p>
      <h1 class="text-5xl font-bold text-[#f3d8bb] title-glow leading-tight">
        Ma Sói<br>
        <span class="text-[#fbd384]">Online</span>
      </h1>
      <p class="mt-4 text-[#a6bbbb] text-sm leading-relaxed">
        Tạo phòng · Chọn kịch bản · Mời AI vào bàn tròn
      </p>
    </div>

    <!-- Form card -->
    <form method="post" action="/rooms" class="lobby-card p-8 space-y-6">

      <!-- Scenario -->
      <div>
        <label class="block text-[10px] uppercase tracking-[0.15em] text-[#64b5bf] mb-2.5 font-semibold">
          Kịch bản
        </label>
        <select id="scenario_select" name="scenario_id"
                class="w-full bg-[#06101a] border border-[#11516f] rounded-lg px-3.5 py-2.5
                       text-[#f3d8bb] text-sm cursor-pointer">
          {% for s in scenarios %}
          <option value="{{ s.scenario_id }}" data-min="{{ s.min_players }}" data-max="{{ s.max_players }}">
            {{ s.display_name }} — {{ s.min_players }}–{{ s.max_players }} người
          </option>
          {% endfor %}
          <option value="random" data-min="9" data-max="20">🎲 Ngẫu nhiên</option>
        </select>
      </div>

      <!-- Player count -->
      <div>
        <label class="block text-[10px] uppercase tracking-[0.15em] text-[#64b5bf] mb-2.5 font-semibold">
          Số người chơi
        </label>
        <input id="total_players_input" type="number" name="total_players" value="9" min="9" max="20"
               class="w-full bg-[#06101a] border border-[#11516f] rounded-lg px-3.5 py-2.5
                      text-[#f3d8bb] text-sm">
        <p class="text-[10px] text-[#64b5bf] mt-2 leading-relaxed opacity-70">
          MVP: 9–20 người — toàn bộ ghế do AI điều khiển.
        </p>
      </div>

      <!-- Divider -->
      <div class="border-t border-[#11516f] opacity-40"></div>

      <!-- Submit -->
      <button type="submit" class="btn-primary w-full text-sm">
        Tạo phòng →
      </button>
    </form>

    <!-- Footer note -->
    <p class="text-center text-[10px] text-[#11516f] mt-6 tracking-wider uppercase">
      Ma Sói Online · AI-powered · Local Hosted
    </p>

  </div>
</div>

<script src="/static/js/lobby.js"></script>

<script>
(function () {
  var sel = document.getElementById("scenario_select");
  var inp = document.getElementById("total_players_input");
  function sync() {
    var opt = sel.options[sel.selectedIndex];
    var mn = parseInt(opt.dataset.min || 9);
    var mx = parseInt(opt.dataset.max || 20);
    inp.min = mn;
    inp.max = mx;
    inp.value = mn;
  }
  sel.addEventListener("change", sync);
  sync();
})();
</script>
</body>
</html>
